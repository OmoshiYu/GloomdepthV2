
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Глубины Мрака</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ruslan+Display&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        background-color: #0c0a09; /* stone-950 */
        overflow: hidden;
        font-family: 'Ruslan Display', cursive;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none; /* Disable browser handling of gestures */
      }
      canvas {
        display: block;
        image-rendering: pixelated;
        touch-action: none;
      }
      /* Custom scrollbar for modal content */
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
      .font-medieval {
        font-family: 'Ruslan Display', cursive;
      }
      .font-pixel {
        font-family: 'JetBrains Mono', monospace;
      }
      .rpg-border {
        border: 4px solid #44403c; /* stone-700 */
        border-style: ridge;
        box-shadow: 0 0 10px rgba(0,0,0,0.8);
      }
      .rpg-panel {
        background-color: rgba(41, 37, 36, 0.95); /* stone-800 */
        border: 4px double #78350f; /* amber-900 */
        box-shadow: 0 0 20px rgba(0,0,0,0.9), inset 0 0 20px rgba(0,0,0,0.5);
      }
      .rpg-button {
        background: linear-gradient(to bottom, #44403c, #292524);
        border: 2px solid #78350f;
        color: #d6d3d1;
        text-shadow: 1px 1px 0 #000;
        transition: all 0.1s;
      }
      .rpg-button:hover {
        background: linear-gradient(to bottom, #57534e, #44403c);
        border-color: #d97706; /* amber-600 */
        color: #fff;
        transform: translateY(-1px);
      }
      .rpg-button:active {
        transform: translateY(1px);
        border-color: #92400e;
      }
      .text-shadow {
        text-shadow: 2px 2px 0 #000;
      }
      .text-glow {
        text-shadow: 0 0 5px rgba(251, 191, 36, 0.5);
      }
      @keyframes logFadeOut {
        0% { opacity: 1; transform: translateX(0); }
        70% { opacity: 1; transform: translateX(0); }
        100% { opacity: 0; transform: translateX(-10px); }
      }
      .animate-log {
        animation: logFadeOut 3.5s ease-out forwards;
      }
    </style>
  <script type="importmap">
{

    "react": "https://aistudiocdn.com/react@^19.2.0",

    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.5/+esm"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>

    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
